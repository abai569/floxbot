name: CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build, for example master or v1.2.0"
        required: false
        default: ""

jobs:
  rails-test:
    name: Rails tests
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      SECRET_KEY_BASE: test-secret-key-base
      TELEGRAM_BOT_TOKEN: test-token
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: password
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Fix binstub permissions
        run: chmod +x bin/*

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libyaml-dev libvips sqlite3

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Prepare test database
        run: bin/rails db:test:prepare

      - name: Run tests
        run: bin/rails test

  docker-build:
    name: Docker build and publish
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Resolve image tags
        id: meta
        shell: bash
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${OWNER}/${{ github.event.repository.name }}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          REF_NAME="${{ github.ref_name }}"
          INPUT_REF="${{ github.event.inputs.ref }}"

          TAGS="${IMAGE}:sha-${SHORT_SHA}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            TAGS="${TAGS},${IMAGE}:pr-${{ github.event.pull_request.number }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${REF_NAME}"
            TAGS="${TAGS},${IMAGE}:${VERSION},${IMAGE}:${VERSION#v}"
          elif [[ -n "${INPUT_REF}" && "${INPUT_REF}" == v* ]]; then
            VERSION="${INPUT_REF}"
            TAGS="${TAGS},${IMAGE}:${VERSION},${IMAGE}:${VERSION#v}"
          elif [[ "${{ github.ref_name }}" == "master" ]]; then
            TAGS="${TAGS},${IMAGE}:master,${IMAGE}:latest"
          fi

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "push=${{ github.event_name != 'pull_request' }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
