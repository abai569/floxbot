version: '3.8'

services:
  app:
    build: .
    ports:
      - "${PORT:-8060}:80"
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DATABASE_URL: sqlite3:///rails/storage/production.sqlite3
    volumes:
      - production_data:/rails/storage
      - production_log:/rails/log
    command: ["./bin/thrust", "./bin/rails", "server"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8060}/up"]
      interval: 30s
      timeout: 10s
      retries: 3

  bot:
    build: .
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      DATABASE_URL: sqlite3:///rails/storage/production.sqlite3
      JOB_CONCURRENCY: 3
    volumes:
      - production_data:/rails/storage
      - production_log:/rails/log
    command: ["/rails/bin/bot"]
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  job:
    build: .
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      DATABASE_URL: sqlite3:///rails/storage/production.sqlite3
    volumes:
      - production_data:/rails/storage
      - production_log:/rails/log
    command: ["/rails/bin/run_queue_jobs"]
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

volumes:
  production_data:
  production_log:
