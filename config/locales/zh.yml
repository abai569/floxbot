zh:
  # === Telegram Bot Messages (existing) ===
  telegram_bot:
    settings:
      open_instructions: "Click the button below to open the settings panel for this group."
    welcome:
      title: "🤖 欢迎使用 FloBot 群组管理机器人！"
      description: "入群验证、关键字回复、垃圾信息检测，一站式群组管理。\n代码[开源地址](https://github.com/abai569/floxbot)"
      select_option: "请选择下面的选项："
    buttons:
      open_settings: "⚙️ 群组设置"
      user_guide: "📖 使用说明"
      add_to_group: "💯 拉我进群"
      back: "返回"
    user_guide:
      title: "📖 *使用说明*"
      how_to_use: "*如何使用：*"
      steps:
        - "将机器人[添加到您的群组](https://t.me/%{bot_username}?startgroup=true)"
        - "给予机器人管理员权限（删除消息、封禁用户权限）"
        - "在 Web 管理面板配置群组设置（验证/欢迎/关键字等）"
      basic_features: "*主要功能：*"
      features:
        - "入群验证（按钮/数学验证码），有效拦截广告号"
        - "自定义欢迎消息（支持 文字/图片/视频 + 内联按钮）"
        - "关键字自动回复（精确匹配 / 正则匹配 / 包含匹配）"
        - "垃圾信息自动检测与封禁（机器学习模型）"
        - "消息清理（自动删除转发、关键字触发消息等）"
        - "群组配置 Web 管理面板"
      commands_title: "*命令列表：*"
      commands:
        start: "/start - 查看帮助"
        markspam: "/markspam - 标记广告并封禁用户（回复消息使用）"
        feedspam: "/feedspam - 投喂广告文本训练机器人"
        listspam: "/listspam - 查看被拦截广告消息列表"
        listbanuser: "/listbanuser - 查看被封禁用户列表"
        setverify: "/setverify - 设置入群验证模式"
        help: "/help - 查看帮助"
    setlang:
      deprecation_message: "Setting the language via command is deprecated. Please use the /settings command to open the settings panel and configure the language."
      usage: "用法: /setlang <语言代码>. 可选: %{available_locales}"
      success: "✅ 此群组的语言已设置为: %{language}"
      failure: "❌ 未能设置此群组的语言。"
      unsupported_language: "❌ 不支持的语言: %{language}. 可选: %{available_locales}"
      general_error: "❌ 设置语言时发生意外错误。"
    errors:
      processing: "处理请求时出错。"
    markspam:
      success_message: "✅ 用户的消息 @[%{banned_user_name}](tg://user?id=%{user_id}) 已被删除且封禁."
      delete_message_only_success_message: "✅ 用户的消息 @[%{banned_user_name}](tg://user?id=%{user_id}) 已被删除."
      insufficient_permission_to_delete_message: "❌ 无权限删除消息"
      failure_message: "❌ 处理垃圾文本异常."
    feedspam:
      help_message: "请在此命令后提供垃圾信息文本。示例：`/feedspam 看我简介，免费送U`"
      success_message: "✅ 收到，已把这条信息加入到训练数据:\n\n`%{preview}`"
      failure_message: "❌ 处理投喂数据异常."
      reply_prompt: "/feedspam: 请在此消息下回复你想要投喂的广告信息"
      input_field_placeholder: "请输入你想要投喂的广告信息"
    unban:
      already_unbanned_message: "✅ 用户已被解禁"
      success_message: "✅ 用户 @[%{user_name}](tg://user?id=%{user_id}) 已被解禁."
      failure_message: "❌ 解禁用户失败."
    markasham:
      success_message: "✅ 来自用户 @[%{user_name}](tg://user?id=%{user_id}) 的消息已被标记为非广告."
      failure_message: "❌ 标记消息为非广告失败."
    is_admin:
      error_message: "❌ 你(@[%{user_name}](tg://user?id=%{user_id}))不是当前群组的管理员"
      general_error_message: "❌ 你不是当前群组的管理员"
    listbanuser:
      banned_user_text: "封禁用户"
      page_text: "页"
      total_banned_user: "封禁总用户数"
      user_text: "用户"
      message_text: "消息"
      banned_text: "封禁日期"
      no_banned_user_message: "当前群组无被禁言用户"
      no_banned_on_page_x_message: "在群组 %{group_title} 的第 %{page} 页未找到被封禁用户。请尝试 /listbanuser %{target_group_id} 1 查看第一页内容"
      unban_message: "解禁"
      failure_message: "❌ 获取封禁用户列表异常."
      previous_page: "⬅️ 上一页"
      next_page: "下一页 ➡️"
    listspam:
      spam_message_text: "广告消息"
      page_text: "页"
      total_spam_message_text: "消息总条数"
      user_text: "用户"
      message_text: "消息"
      spamtype_text: "广告类型"
      banned_text: "封禁"
      no_spam_message: "当前群组无被禁言用户"
      no_spam_on_page_x_message: "在群组 %{group_title} 的第 %{page} 页未找到被封禁消息。请尝试 /listspam %{target_group_id} 1 查看第一页内容"
      mark_as_ham_message: "标记为正常"
      failure_message: "❌ 获取封禁消息列表异常."
      previous_page: "⬅️ 上一页"
      next_page: "下一页 ➡️"
    handle_callback:
      error_message: "❌ 处理消息异常"
    is_group_chat:
      error_message: "❌ 当前聊天不是群组"
    verification:
      button: "欢迎 %{name}！请点击下方按钮完成验证。"
      math: "欢迎 %{name}！请计算：%{a} %{op} %{b} = ?"
    handle_regular_message:
      alert_message: "⚠️ 已自动删除检来自 @[%{user_name}](tg://user?id=%{user_id})的广告（此消息%{delete_message_delay}分钟内会自动删除）"
      ban_user_message: "✅ 用户 @[%{user_name}](tg://user?id=%{user_id}) 因发送垃圾广告已被封禁。"
      global_ban_user_message: "✅ 用户 @[%{user_name}](tg://user?id=%{user_id}) 因发送垃圾广告已在所有群组封禁。"

